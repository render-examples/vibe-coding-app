name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # `render blueprints validate` needs a Render login, which a fork's pull
  # request cannot have. The published schema catches the same shape errors.
  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pipx run check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml

  # A template nobody builds is a template that quietly stops building, and the
  # first thing to notice would be a customer's failed run.
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        tier: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: templates/fullstack/${{ matrix.tier }}
      - run: npm run build
        working-directory: templates/fullstack/${{ matrix.tier }}
