# The factory's own gateway, Workflows service, and database, in one project.
#
# This is not the Blueprint that deploys generated apps — that one lives at the
# root of APPS_REPO and is written by app/blueprint.ts.

projects:
  - name: vibe-factory
    environments:
      - name: production
        # Keep network isolation off. In an isolated environment, workflow task
        # runs cannot use the private network, and the workflow connects to the
        # database on that network.
        networking:
          isolation: disabled

        # Secrets you enter once when the Blueprint is created, and rotate in
        # one place. The gateway gets only vibe-factory-shared: the model key
        # and the GitHub credential must never reach it.
        envVarGroups:
          - name: vibe-factory-shared
            envVars:
              # The gateway starts workflow tasks with it. The workflows host
              # uses it for Sandboxes, the Render MCP server, Blueprint reads,
              # and the deletes of a deleted app's resources.
              - key: RENDER_API_KEY
                sync: false
          - name: vibe-factory-workflow-secrets
            envVars:
              - key: APPS_REPO
                sync: false
              - key: RENDER_WORKSPACE_ID
                sync: false
              - key: ANTHROPIC_API_KEY
                sync: false
              # Set the three GitHub App variables or GITHUB_TOKEN. Each option
              # needs Contents: write on APPS_REPO.
              - key: GITHUB_APP_ID
                sync: false
              - key: GITHUB_APP_PRIVATE_KEY
                sync: false
              - key: GITHUB_APP_INSTALLATION_ID
                sync: false
              - key: GITHUB_TOKEN
                sync: false

        databases:
          - name: vibe-factory-db
            plan: 0.1c-256mb

        services:
          - type: web
            name: vibe-factory-gateway
            runtime: docker
            plan: 0.5c-512mb
            # Applies app/schema.sql before any new instance serves traffic.
            preDeployCommand: npm run db:migrate
            healthCheckPath: /ready
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: vibe-factory-db
                  property: connectionString
              # Generated once when the Blueprint creates the gateway and
              # preserved across later syncs.
              - key: FACTORY_API_KEY
                generateValue: true
              - key: UI_USERNAME
                sync: false
              - key: UI_PASSWORD
                sync: false
              - key: RENDER_WORKFLOW_SLUG
                fromService:
                  type: workflow
                  name: vibe-factory-workflows
                  property: slug
              - fromGroup: vibe-factory-shared

          # Runs every task that app/host.ts registers. The model key and the
          # GitHub credential are set only here, never on the gateway. With no
          # repo field, it builds the repository that holds this Blueprint, so
          # a fork's workflow runs the fork's code.
          - type: workflow
            name: vibe-factory-workflows
            runtime: node
            # A workflow must set its region. Task runs connect to the database
            # on the private network, and that network does not cross regions.
            # Use the same region as the database, which is oregon by default.
            region: oregon
            buildCommand: npm ci --omit=dev
            startCommand: npm run start:workflows
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: vibe-factory-db
                  property: connectionString
              - fromGroup: vibe-factory-shared
              - fromGroup: vibe-factory-workflow-secrets
